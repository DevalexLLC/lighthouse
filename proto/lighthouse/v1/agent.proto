// Agent <-> control plane channel. Every RPC here requires mTLS; the agent's
// identity is ALWAYS taken from the client certificate URI SAN
// (lighthouse://agent/<uuid>) and never from message fields.
syntax = "proto3";

package lighthouse.v1;

import "google/protobuf/timestamp.proto";
import "lighthouse/v1/common.proto";

option go_package = "github.com/devalexllc/lighthouse/internal/pb/lighthousev1";

service AgentService {
  // Long-lived stream: the server pushes FULL config snapshots (never
  // diffs); the agent diffs locally against its running workers. The open
  // stream doubles as agent liveness.
  rpc StreamConfig(AgentHello) returns (stream ConfigSnapshot);

  // Batched result ingestion. Results may arrive late and out of order
  // (disk spool replay after an outage); the server orders by started_at.
  rpc PushResults(PushResultsRequest) returns (PushResultsResponse);

  // Certificate rotation over the existing mTLS channel (CSR in, cert out).
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);
}

message AgentHello {
  string agent_version = 1;
  // Hash of the config snapshot the agent is currently running; lets the
  // server skip a no-op initial push.
  string config_hash = 2;
}

message ConfigSnapshot {
  // Content hash of the snapshot (server-computed, stable for identical
  // configs).
  string config_hash = 1;
  repeated ProbeSpec probes = 2;
  SpoolPolicy spool = 3;
}

// Server-tunable spool bounds (agent-local config takes precedence if set).
message SpoolPolicy {
  int64 max_bytes = 1;
  int64 max_age_seconds = 2;
}

message PushResultsRequest {
  repeated ProbeResult results = 1;
  // Number of results dropped from the spool (overflow/age) since the last
  // successful push — loss is reported, never silent.
  uint64 dropped_since_last_push = 2;
}

message PushResultsResponse {
  uint32 accepted = 1;
}

message RenewCertRequest {
  // PKCS#10 CSR, DER (fresh key allowed; identity comes from the current
  // client certificate, not the CSR subject).
  bytes csr_der = 1;
}

message RenewCertResponse {
  bytes cert_der = 1;
  bytes ca_bundle_der = 2;
  google.protobuf.Timestamp not_after = 3;
}
