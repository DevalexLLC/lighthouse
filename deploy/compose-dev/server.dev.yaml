# lighthouse-server dev configuration (compose dev overlay only).
listen:
  grpc: ":8443"
  grpc_hostname: grpc.lighthouse.local
  http: ":8080"
db:
  url: postgres://lighthouse:lighthouse-dev@timescaledb:5432/lighthouse
tls:
  cert_file: /etc/lighthouse/tls/server.crt
  key_file: /etc/lighthouse/tls/server.key
ca:
  dir: /var/lib/lighthouse-server/ca
  # Cert-rotation e2e switch: uncomment, then `make reset && make up` so the
  # fleet enrolls with 10-minute certs (renewal fires ~5 min in).
  # agent_cert_lifetime: 10m
log:
  level: debug
