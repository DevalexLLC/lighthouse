# Lighthouse control plane — production base stack.
#
# The ONLY exposed port is 443 on the proxy (SNI passthrough; see
# ../proxy/nginx.conf). TimescaleDB and the server are internal-only.
#
# Production expects:
#   - LIGHTHOUSE_DB_PASSWORD set in the environment or .env (required, no default)
#   - ./server.yaml         (copy server.example.yaml and edit)
#   - server TLS cert/key in the "tls" volume (or replace with a bind mount)
#   - images loaded via `docker load` from the release bundle (air-gapped)
#
# Dev environments must NEVER compose this file alone — always together with
# ../compose-dev/docker-compose.dev.yml (make up does this). Composing the
# base alone silently removes the dev overlay services.

name: lighthouse

services:
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

  server:
    image: lighthouse-server:${LIGHTHOUSE_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ./server.yaml:/etc/lighthouse/server.yaml:ro
      - server-state:/var/lib/lighthouse-server
      - tls:/etc/lighthouse/tls
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb-ha:pg16-all
    restart: unless-stopped
    environment:
      POSTGRES_DB: lighthouse
      POSTGRES_USER: lighthouse
      POSTGRES_PASSWORD: ${LIGHTHOUSE_DB_PASSWORD:?LIGHTHOUSE_DB_PASSWORD must be set}
    volumes:
      - dbdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lighthouse -d lighthouse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
  server-state:
  tls:
